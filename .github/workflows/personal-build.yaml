name: Personal Build

# Builds a signed release APK for personal use.
#
# The release keystore lives in this repository's secrets, so every APK published here is signed
# with the same key and can be installed over the previous one (no uninstall needed). The version
# code grows with the run number for the same reason.
#
# Stable download link (always the most recent run):
#   https://github.com/alarmedvine/nextplayer/releases/download/personal-latest/nextplayer-arm64-v8a.apk
#
# Non-main branches are never built automatically: dispatch this workflow manually and pick the
# branch in the "Use workflow from" dropdown.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Decode keystore
        uses: timheuer/base64-to-file@v2
        id: keystore
        with:
          fileName: 'personal-release.jks'
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ 100000 + github.run_number }}
        run: |
          ./gradlew assembleRelease \
            -PciVersionCode="$VERSION_CODE" \
            -PciVersionNameSuffix="-personal.${{ github.run_number }}"

      - name: Rename APKs to stable file names
        run: |
          cd app/build/outputs/apk/release
          mv app-arm64-v8a-release.apk nextplayer-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk nextplayer-armeabi-v7a.apk
          mv app-universal-release.apk nextplayer-universal.apk
          mv app-x86-release.apk nextplayer-x86.apk
          mv app-x86_64-release.apk nextplayer-x86_64.apk
          ls -l

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-personal-${{ github.run_number }}
          path: app/build/outputs/apk/release/nextplayer-*.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: 0.19.0-personal.${{ github.run_number }}
        run: |
          gh release delete personal-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create personal-latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Personal build $VERSION_NAME" \
            --prerelease \
            --notes "Signed personal build of ${{ github.sha }} (versionName $VERSION_NAME, versionCode ${{ 100000 + github.run_number }})." \
            app/build/outputs/apk/release/nextplayer-*.apk
